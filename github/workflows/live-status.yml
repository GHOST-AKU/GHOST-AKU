name: Refresh pixel telemetry

on:
  schedule:
    - cron: '23 */6 * * *' # UTC; schedules may be delayed by GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub metrics and draw SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_status.py
      - name: Commit updated telemetry if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/live-status.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh pixel telemetry'
            git push
          fi
