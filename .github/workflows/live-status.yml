name: Refresh README telemetry

on:
  schedule:
    - cron: '23 */6 * * *' # UTC; GitHub scheduled runs may be delayed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh Markdown data using public GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_readme.py
      - name: Commit only meaningful README changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile telemetry'
            git push
          fi
